<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIKO Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-area">
                <div class="pulse-ring"></div>
                <div class="logo">AIKO</div>
            </div>
            <div class="status" id="status-text">Bağlanıyor...</div>
        </div>
        
        <div class="chat-area" id="chat-area">
            <div class="message system">Aiko bağlandı. Ekranında olan biteni izliyor...</div>
        </div>

        <div class="input-area">
            <button id="mic-btn" class="icon-btn" title="Sesli Komut (Basılı Tut veya Tıkla)">
                <span class="material-icons-round">mic</span>
            </button>
            <input type="text" id="text-input" placeholder="Yazın veya konuşun..." autocomplete="off">
            <button id="stop-btn" class="icon-btn danger" title="Durdur" style="display: none;">
                <span class="material-icons-round">stop</span>
            </button>
            <button id="send-btn" class="icon-btn primary" title="Gönder ve Ekranı Analiz Et">
                <span class="material-icons-round">send</span>
            </button>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
